version: "3.8"

services:
  # PostgreSQL (can be replaced with Supabase in production)
  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: airfun
      POSTGRES_USER: airfun
      POSTGRES_PASSWORD: airfun_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Redis for caching
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
