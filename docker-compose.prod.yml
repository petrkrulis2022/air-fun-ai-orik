version: "3.8"

# Production Docker Compose configuration
# This file is used for production deployments with external services

services:
  # Backend API service
  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
      args:
        - NODE_ENV=production
    image: airfun/backend:latest
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Database - Use Supabase in production
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      # Redis - Use AWS ElastiCache in production
      - REDIS_URL=${REDIS_URL}
      # JWT Secrets
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      # Blockchain
      - HEDERA_ACCOUNT_ID=${HEDERA_ACCOUNT_ID}
      - HEDERA_PRIVATE_KEY=${HEDERA_PRIVATE_KEY}
      - BASE_RPC_URL=${BASE_RPC_URL}
      - BASE_PRIVATE_KEY=${BASE_PRIVATE_KEY}
      # AWS S3
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      # Contract Addresses
      - HEDERA_FACTORY_ADDRESS=${HEDERA_FACTORY_ADDRESS}
      - BASE_FACTORY_ADDRESS=${BASE_FACTORY_ADDRESS}
      - HEDERA_AIR_TOKEN_ADDRESS=${HEDERA_AIR_TOKEN_ADDRESS}
      - BASE_AIR_TOKEN_ADDRESS=${BASE_AIR_TOKEN_ADDRESS}
    restart: always
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  # Frontend Streamer application
  frontend-streamer:
    build:
      context: .
      dockerfile: packages/frontend-streamer/Dockerfile
      args:
        - NODE_ENV=production
    image: airfun/frontend-streamer:latest
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  # Frontend Viewer application
  frontend-viewer:
    build:
      context: .
      dockerfile: packages/frontend-viewer/Dockerfile
      args:
        - NODE_ENV=production
    image: airfun/frontend-viewer:latest
    ports:
      - "8081:80"
    depends_on:
      - backend
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

networks:
  default:
    driver: bridge
